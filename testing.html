<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testing Page</title>
<style>
  :root { --bg:#f7f5f0; --fg:#1a1a1a; --muted:#6b6b6b; --accent:#2f6f4f; --line:#e2ded5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --fg:#eee; --muted:#9a9a9a; --accent:#6fcf97; --line:#2a2a2a; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, sans-serif; }
  main { max-width:720px; margin:0 auto; padding:64px 16px; }
  h1 { font-size:clamp(2rem,6vw,3.2rem); margin:0 0 8px; letter-spacing:-0.02em; }
  p.sub { color:var(--muted); margin:0 0 40px; }
  .card { border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:16px; }
  .ok { color:var(--accent); font-weight:600; }
  button { background:var(--accent); color:var(--bg); border:0; border-radius:8px; padding:10px 18px; font:inherit; cursor:pointer; }
  code { font-family:ui-monospace, monospace; }
</style>
</head>
<body>
<main>
  <h1>Testing Page</h1>
  <p class="sub">Branch <code>claude/github-testing-page-html-uifl69</code></p>
  <div class="card"><span class="ok">✓ HTML</span> renders fine.</div>
  <div class="card"><span class="ok">✓ CSS</span> light and dark mode both work.</div>
  <div class="card">
    <span class="ok" id="js">… JS</span> check:
    <button id="btn">Click me</button> <span id="count">0</span> clicks
  </div>
  <div class="card">Loaded at <code id="time"></code></div>
</main>
<script>
  document.getElementById('js').textContent = '✓ JS';
  document.getElementById('time').textContent = new Date().toLocaleString();
  let n = 0;
  document.getElementById('btn').onclick = () => document.getElementById('count').textContent = ++n;
</script>
</body>
</html>
